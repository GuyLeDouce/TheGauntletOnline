<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InSquignito's Ugly Interview</title>
    <meta name="description" content="A Squigs Reloaded survival interview. Get hired, get roasted, stay ugly.">
    <link rel="preconnect" href="https://i.imgur.com">
    <link rel="preload" as="image" href="https://i.imgur.com/8U7n401.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-view="menu">
    <div class="app-shell" id="app">
      <header class="topbar">
        <a class="brand" href="/" aria-label="InSquignito's Ugly Interview">
          <span class="brand-mark">UGLY LABS</span>
          <span>Interview Office</span>
        </a>
        <nav class="top-actions" aria-label="Primary">
          <button type="button" class="text-button" data-open="how">How It Works</button>
          <button type="button" class="text-button" data-open="leaderboard">Leaderboard</button>
          <button type="button" class="text-button" data-open="claims">My $CHARM Claims</button>
        </nav>
      </header>

      <main>
        <section id="interviewStage" class="interview-stage" data-view="menu" data-scene="hero">
          <img
            id="sceneImage"
            class="interview-stage__image"
            src="https://i.imgur.com/8U7n401.png"
            alt="InSquignito at the Ugly Labs interview desk for the main menu"
            loading="eager"
          >
          <div class="stage-vignette"></div>
          <div class="stage-badge" id="sceneBadge">Ugly Labs HR</div>
          <div class="stage-hud" id="stageHud" aria-live="polite"></div>
          <div class="stage-desk-console" id="stageDeskConsole" aria-live="polite"></div>
        </section>
      </main>

      <div class="toast-stack" id="toastStack" aria-live="polite"></div>
    </div>

    <dialog class="paper-modal" id="howDialog">
      <div class="paper-modal__body">
        <div class="paper-modal__heading">
          <h2>How It Works</h2>
          <button type="button" class="stamp-button" data-close="how" aria-label="Close">Close</button>
        </div>
        <div id="howCopy" class="step-list"></div>
      </div>
    </dialog>

    <dialog class="paper-modal paper-modal--wide" id="leaderboardDialog">
      <div class="paper-modal__body">
        <div class="paper-modal__heading">
          <h2>Leaderboard</h2>
          <button type="button" class="stamp-button" data-close="leaderboard" aria-label="Close">Close</button>
        </div>
        <div class="tab-row" role="tablist" aria-label="Leaderboard period">
          <button type="button" class="tab active" data-period="weekly">Weekly</button>
          <button type="button" class="tab" data-period="monthly">Monthly</button>
          <button type="button" class="tab" data-period="all-time">All-Time</button>
        </div>
        <div id="leaderboardRows" class="leaderboard-rows">Loading...</div>
      </div>
    </dialog>

    <dialog class="paper-modal paper-modal--wide" id="claimsDialog">
      <div class="paper-modal__body">
        <div class="paper-modal__heading">
          <h2>My $CHARM Claims</h2>
          <button type="button" class="stamp-button" data-close="claims" aria-label="Close">Close</button>
        </div>
        <div id="claimRows" class="claim-rows">Loading...</div>
      </div>
    </dialog>

    <dialog class="paper-modal paper-modal--wide" id="scanDialog">
      <div class="paper-modal__body">
        <div class="paper-modal__heading">
          <h2>Wallet Scan Details</h2>
          <button type="button" class="stamp-button" data-close="scan" aria-label="Close">Close</button>
        </div>
        <div id="scanDetails" class="scan-details"></div>
      </div>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
